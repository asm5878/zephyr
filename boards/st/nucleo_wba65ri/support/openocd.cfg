# Note: Using OpenOCD on nucleo_wba65ri requires a recent or patched
# openocd tool. See board documentation for more information.

source [find interface/stlink-dap.cfg]

set WORKAREASIZE 0x8000

transport select "dapdirect_swd"

# Enable debug when in low power modes
set ENABLE_LOW_POWER 1

# Stop Watchdog counters when halt
set STOP_WATCHDOG 1

# STlink Debug clock frequency
set CLOCK_FREQ 8000

# Reset configuration
# use hardware reset, connect under reset
# connect_assert_srst needed if low power mode application running (WFI...)
reset_config srst_only srst_nogate connect_assert_srst
set CONNECT_UNDER_RESET 1
set CORE_RESET 0

# Debug and reset-recovery flows reset and halt after OpenOCD initialization.
# Attach drops connect-under-reset and halts an active core without resetting it.
rename init old_init
proc init {} {
	global RESET_ATTACH
	global _ZEPHYR_RUNNER_COMMAND
	global _TARGETNAME

	set no_reset_attach [expr {
		[info exists _ZEPHYR_RUNNER_COMMAND] &&
		$_ZEPHYR_RUNNER_COMMAND eq "attach" &&
		!([info exists RESET_ATTACH] && $RESET_ATTACH)
	}]

	if {$no_reset_attach} {
		reset_config srst_only srst_nogate connect_deassert_srst
		old_init
		adapter deassert srst
		$_TARGETNAME arp_halt
		$_TARGETNAME arp_poll
		return
	}

	old_init
	reset halt
}

# STM32WBA65 was recently added in OpenOCD (Jan-2026). Fallback to WBA55 without
# device identification or software breakpoints if target config file is not
# found.
if {[catch {ocd_find target/stm32wba6x.cfg} t]==0} {
	source [find target/stm32wba6x.cfg]
} else {
	source [find target/stm32wbax.cfg]

	gdb_memory_map disable
}

$_TARGETNAME configure -event gdb-attach {
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	# Attach can disconnect while running; only resume when halted.
	if {[$_TARGETNAME curstate] == "halted"} {
		resume
	}
}
