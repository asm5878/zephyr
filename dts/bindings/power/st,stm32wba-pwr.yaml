title: STM32WBA power controller

description: |
  Power controller of STM32WBA series

  Controls the memory retained in s2ram power state.

compatible: "st,stm32wba-pwr"

include: "st,stm32-dualreg-pwr.yaml"

properties:
  standby-exit-latency-profiling:
    type: boolean
    description: |
      Enables one-shot measurement of the Standby software exit latency.
      The first successful Standby resume measures SoC restoration and
      synchronous device resume using SysTick clocked by LSE. The measured
      value replaces standby-exit-latency-initial-us in the custom PM policy.

      Requires CONFIG_PM_S2RAM, an unused SysTick, enabled LSE, and
      CONFIG_PM_EARLY_SYSTEM_TIMER_RESUME disabled. The SoC defaults to
      CONFIG_PM_POLICY_CUSTOM when this property is present; selecting the
      default PM policy explicitly is not supported with profiling enabled.

      Hardware wakeup and execution outside the measurement interval are not
      included. A single software measurement is not a worst-case bound.
      The power state's exit-latency-us still controls latency-request filtering.

  standby-exit-latency-initial-us:
    type: int
    description: |
      Initial Standby exit latency in microseconds, required when
      standby-exit-latency-profiling is enabled and ignored otherwise.
      Used for state selection and wakeup advance until the first successful
      measurement replaces it. Choose a conservative budget covering hardware
      and software wakeup time; waking too late can hide oscillator startup
      behind an independent radio wakeup request and underestimate resume time.

  retain-sram2:
    type: boolean
    description: |
      Enables retention of SRAM2 while in Standby low-power mode.
      (Standby mode is a suspend-to-RAM power state)

      If this property is present, the entire SRAM2 memory region
      will be retained in Standby mode (all contents preserved).

      If this property is not present, the SRAM2 memory region will
      will not be retained in Standby mode (all contents are lost),
      except if the Zephyr RAM region `/chosen/zephyr,sram` overlaps
      with SRAM2 (in this case, retention is always enabled).

examples:
  - |
    &pwr {
            standby-exit-latency-profiling;
            standby-exit-latency-initial-us = <1500>;
    };
  - |
    /*
     * Not used RAM retained (and so powered) is simply a
     * pointless waste of energy.
     * `/chosen/zephyr,sram` (Zephyr system memory) is mapped on
     * sram0 memory controller.
     * According the required ram, sram0 memory controller will use
     * SRAM1 (up to 448KB) and SRAM2 (up to 64KB) physical banks.
     *
     * Let's imagine a build report shows an application needs
     * 120 KB of RAM and Standby low-power feature is required.
     * In this case only the first 2 pages of SRAM1 will be retained.
     * And SRAM2 is not retained by default.
     * The overlay file can be modified like this:
     */
    sram0: memory@20000000 {
            reg = <0x20000000 DT_SIZE_K(120)>;
    };
  - |
    /*
     * If for any specific reason application needs to retain SRAM2:
     */
    &pwr {
            power-supply = "smps";
            retain-sram2;
            status = "okay";
    };
  - |
    /*
     * If full memory is required, SRAM1 and SRAM2 will be
     * fully retained and the sram0 memory node will appear
     * like this:
     */
    sram0: memory@20000000 {
            reg = <0x20000000 DT_SIZE_K(512)>;
    };
